[project]
name = "roomomatic"
version = "0.1.0"
description = "Client library and rom CLI for lobbyd, roomsd and agentd"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/room-o-matic/docs"
Repository = "https://github.com/room-o-matic/client"
Issues = "https://github.com/room-o-matic/docs/issues"

[project.scripts]
rom = "roomomatic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
